[build-system]
requires = [
  "scikit-build-core>=0.10",
  "wheel",
  "pybind11>=2.13"
]
build-backend = "scikit_build_core.build"

[project]
name = "gaffa"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "lintian233" }]
description = "CUDA/C++ and Python toolkit for pulsar data processing and FFA searches."
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<2.5",
]

[project.scripts]
gaffa_search = "gaffa._cli:main"

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.5",
]

[tool.scikit-build]
wheel.packages = ["python/gaffa"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake]
version = ">=3.26"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.scikit-build.sdist]
include = [
  "CMakeLists.txt",
  "conanfile.py",
  "environment.yml",
  "justfile",
  "include/**",
  "src/**",
  "python/**",
  "tests/**",
]
exclude = [
  "build/**",
  "_skbuild/**",
  "dist/**",
  ".git/**",
  ".github/**",
]

[tool.cibuildwheel]
build = ["cp312-*"]
archs = ["x86_64"]
skip = ["*-musllinux_*", "pp*"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "gaffa-manylinux_2_28-cuda12:12.8"
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_x86_64 --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libcufft.so.11 --exclude libcurand.so.10 -w {dest_dir} {wheel}"


[tool.cibuildwheel.environment]
CMAKE_BUILD_TYPE = "Release"
CMAKE_CUDA_ARCHITECTURES = "75;80;86;89;90;100;120"
CUDA_HOME = "/usr/local/cuda"
CUDACXX = "/usr/local/cuda/bin/nvcc"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests/typecheck"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
