# Example GAFFA search configuration for:
#   tests/data/PT2023_0192_Mercer_5_20231221_c8_t4_filtool_01.fil
#
# Run from the repository root with a Loki-enabled build:
#   build/loki-release/gaffa_search --config tests/data/example.yaml
#
# Relative paths are resolved relative to this YAML file.

version: 1

input:
  path: PSR04_RLGC_2_M03_filtool_196us_01.fil

dm_ranges:
  # - low: 10
  #   step: 0.5
  #   count: 512
  - low: 266
    step: 1.0
    count: 512
  # - low: 778
  #   step: 1.0
  #   count: 512
  # - low: 1290
  #   step: 2.5
  #   count: 512

dedispersion:
  backend: cuda-subband
  device: 0
  subband_channels: 32
  ndm_per_nominal: 32

resources:
  # Native CUDA compact peak buffer cap. Loki does not use this setting.
  native_cuda:
    max_peak_memory: 4GiB

search:
  dm_tile_size: 32
  devices:
    native_cuda: [0, 1]
    loki_cuda: [0, 1]
  ranges:
    # - backend: native-cuda
    #   period:
    #     min: 0.1
    #     max: 1.0
    #   bins:
    #     min: 256
    #     max: 320
    #   duty_cycle_max: 0.5
    #   width_trial_spacing: 1.5
    #   reduction:
    #     top_k: 100
    #     max_groups: 10000
    #     frequency_tolerance_hz: 0.02
    # - backend: native-cuda
    #   period:
    #     min: 0.005
    #     max: 0.02
    #   bins:
    #     min: 25
    #     max: 80
    #   reduction:
    #     top_k: 100
    #     max_groups: 10000
    #     frequency_tolerance_hz: 0.02
    # - backend: native-cuda
    #   period:
    #     min: 1.0
    #     max: 50
    #   bins:
    #     min: 512
    #     max: 1024
    #   reduction:
    #     top_k: 100
    #     max_groups: 10000
    #     frequency_tolerance_hz: 0.02
    - backend: loki-cuda
      period:
        min: 0.05
        max: 1.0
      # SI units: accel in m/s^2, jerk in m/s^3.
      bins:
        min: 120
        max: 200
      # Loki P-FFA requires a power-of-two search length.
      window: truncate
      reduction:
        top_k: 100
        max_groups: 10000
        # Conservative Loki phase-cell width used only for backend reduction.
        phase_tolerance_cycles: 2

preprocess:
  kind: riptide
  running_median_seconds: 5.0

candidate:
  detection:
    snr_threshold: 7.5
    max_peaks_per_dm: 0
    max_total_raw_peaks: 0
  grouping:
    max_phase_distance_cycles: 0.05
    merge_widths: true
  clustering:
    max_phase_distance_cycles: 0.1
    max_dm_distance: 100
    merge_widths: true
  harmonic:
    max_harmonic: 16
    denominator_max: 5
    frequency_tolerance_bins: null
    phase_distance_max: 1.0
    dm_distance_max: 3.0
    use_snr_consistency: false
    snr_distance_max: 3.0
  selection:
    snr_min: 0.0
    max_candidates: 0

output:
  prefix: example
  print_candidates: 64
  overwrite: true
