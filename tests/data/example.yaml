# Example GAFFA search configuration for:
#   tests/data/PT2023_0192_Mercer_5_20231221_c8_t4_filtool_01.fil
#
# Run from the repository root with a Loki-enabled build:
#   build/loki-release/gaffa_search --config tests/data/example.yaml
#
# Relative paths are resolved relative to this YAML file.

version: 1

input:
  path: PT2023_0192_Mercer_5_20231221_c8_t4_filtool_01.fil

dm_ranges:
  - low: 10
    step: 0.5
    count: 512
  - low: 266
    step: 1.0
    count: 512
  - low: 778
    step: 1.0
    count: 512
  - low: 1290
    step: 2.5
    count: 512

dedispersion:
  backend: cuda-subband
  device: 0
  subband_channels: 32
  ndm_per_nominal: 32

resources:
  # Native CUDA compact peak buffer cap. Loki does not use this setting.
  native_cuda:
    max_peak_memory: 4GiB

search:
  dm_tile_size: 32
  devices:
    native_cuda: [0, 1]
    loki_cuda: [0, 1]
  ranges:
    - backend: native-cuda
      period:
        min: 0.05
        max: 1.0
      bins:
        min: 128
        max: 256
      # Native FFA uses the original input length. Loki-only window
      # policies are intentionally not specified for a native range.
      reduction:
        top_k: 100
        max_groups: 100
        frequency_tolerance_hz: 0.0

    - backend: loki-cuda
      period:
        min: 0.1
        max: 1.0
      # SI units: accel in m/s^2, jerk in m/s^3.
      accel:
        min: -500
        max: 500
      bins:
        min: 60
        max: 120
      # Loki P-FFA requires a power-of-two search length.
      window: truncate
      reduction:
        top_k: 100
        max_groups: 100

preprocess:
  kind: riptide
  running_median_seconds: 5.0

candidate:
  snr_threshold: 7.5
  max_peaks: 0
  max_total_raw_peaks: 0
  max_candidates: 0
  dm_radius: 100

output:
  print_candidates: 64
  overwrite: false
